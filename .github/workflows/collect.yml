name: Collect YouTube channels and videos

on:
  workflow_dispatch:

  schedule:
    # GitHub Actions cron은 UTC 기준
    # UTC 05:17, 17:17 = 한국 시간 오후 2:17, 다음 날 오전 2:17
    - cron: "17 5,17 * * *"

concurrency:
  group: collect-youtube-channels-and-videos
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      MIN_SUBSCRIBERS: "100000"
      DISCOVERY_QUERY_LIMIT: "25"
      VIDEOS_PER_CHANNEL: "50"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Discover YouTube channels
        run: python -m collector.discover_channels

      - name: Sync recent videos
        run: python -m collector.sync_videos

      - name: Score product candidates
        run: python -m collector.score_videos
